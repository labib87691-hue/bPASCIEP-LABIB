  function applyBpscThemeToDocument(doc, hostIframe) {
    if (!doc) return;

    /* Collapse dedicated floating branding-only iframe if present */
    if (hostIframe && doc.querySelector('link[href*="branding-widget.css"]')) {
      hostIframe.style.setProperty('display', 'none', 'important');
      hostIframe.style.setProperty('height', '0px', 'important');
      hostIframe.style.setProperty('pointer-events', 'none', 'important');
      return;
    }

    var targetRoot = doc.head || doc.documentElement || doc.body;
    if (targetRoot) {
      var styleEl = doc.getElementById(STYLE_ID);
      if (!styleEl) {
        styleEl = doc.createElement('style');
        styleEl.id = STYLE_ID;
        styleEl.type = 'text/css';
        styleEl.appendChild(doc.createTextNode(BPSC_THEME_CSS));
        targetRoot.appendChild(styleEl);
      } else if (styleEl.parentNode === targetRoot && styleEl.nextElementSibling !== null) {
        /* Keep BPSC theme after dynamically re-appended .tawk-global-variables */
        targetRoot.appendChild(styleEl);
      }
    }

    var brandingLinks = doc.querySelectorAll(
      '.tawk-branding, [class*="tawk-branding"], .tawk-to-url, a[href*="utm_source=tawk-messenger"], a[href*="tawk.to/?utm_source"]'
    );
    for (var i = 0; i < brandingLinks.length; i++) {
      brandingLinks[i].style.setProperty('display', 'none', 'important');
    }

    var allAnchors = doc.querySelectorAll('a');
    for (var j = 0; j < allAnchors.length; j++) {
      var txt = (allAnchors[j].textContent || '').toLowerCase();
      var href = (allAnchors[j].getAttribute('href') || '').toLowerCase();
      if (
        (txt.indexOf('tawk.to') !== -1 || txt.indexOf('add free live chat') !== -1) &&
        href.indexOf('tawk.to') !== -1
      ) {
        allAnchors[j].style.setProperty('display', 'none', 'important');
      }
    }
  }

  function inspectFrame(iframe) {
    try {
      var doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
      if (!doc) return;
      applyBpscThemeToDocument(doc, iframe);

      if (!iframe.dataset.bpscTawkThemed && doc.documentElement) {
        iframe.dataset.bpscTawkThemed = '1';
        var innerObserver = new MutationObserver(function () {
          applyBpscThemeToDocument(doc, iframe);
        });
        innerObserver.observe(doc.documentElement, { childList: true, subtree: true });
        iframe.addEventListener('load', function () {
          try {
            var reloadedDoc =
              iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
            applyBpscThemeToDocument(reloadedDoc, iframe);
          } catch (_) {}
        });
      }

      var nestedFrames = doc.querySelectorAll('iframe');
      for (var k = 0; k < nestedFrames.length; k++) {
        inspectFrame(nestedFrames[k]);
      }
    } catch (_) {
      /* Ignore cross-origin frames safely */
    }
  }

  function scanAllTawkFrames() {
    var frames = document.querySelectorAll('iframe');
    for (var i = 0; i < frames.length; i++) {
      var frame = frames[i];
      var title = (frame.getAttribute('title') || '').toLowerCase();
      var id = (frame.id || '').toLowerCase();
      var parentId = (
        frame.parentElement && frame.parentElement.id ? frame.parentElement.id : ''
      ).toLowerCase();
      if (
        title.indexOf('chat') !== -1 ||
        id.indexOf('tawk') !== -1 ||
        parentId.indexOf('tawk') !== -1 ||
        (frame.closest && frame.closest('[class*="widget-"]')) ||
        (!frame.getAttribute('src') || frame.getAttribute('src') === 'about:blank')
      ) {
        inspectFrame(frame);
      }
    }
  }

  window.Tawk_API = window.Tawk_API || {};
  var prevOnLoad = window.Tawk_API.onLoad;
  window.Tawk_API.onLoad = function () {
    if (typeof prevOnLoad === 'function') prevOnLoad();
    scanAllTawkFrames();
    setTimeout(scanAllTawkFrames, 120);
  };

  var prevOnMax = window.Tawk_API.onChatMaximized;
  window.Tawk_API.onChatMaximized = function () {
    if (typeof prevOnMax === 'function') prevOnMax();

  };

  var prevOnMin = window.Tawk_API.onChatMinimized;
  window.Tawk_API.onChatMinimized = function () {
    if (typeof prevOnMin === 'function') prevOnMin();
    scanAllTawkFrames();
  };

  if (document.body) {
    var bodyObserver = new MutationObserver(function () {
      scanAllTawkFrames();
    });
    bodyObserver.observe(document.body, { childList: true, subtree: true });
  }

  setInterval(scanAllTawkFrames, 1200);
})();
